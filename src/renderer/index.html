<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' pet: data: blob:; script-src 'self' pet: 'unsafe-inline'; connect-src 'self' pet:; img-src 'self' pet: data: blob:; style-src 'self' 'unsafe-inline'"
    />
    <title>desktop-l2d</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: default;
        user-select: none;
      }
      #pet {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      /* 遮挡层（模型授权要求"请做好遮挡"）：叠在模型之上，不接收鼠标事件 */
      #overlay {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 4%;
        transform: translateX(-50%);
        max-width: 90%;
        max-height: 60%;
        pointer-events: none;
      }
      #hud {
        position: fixed;
        left: 6px;
        top: 6px;
        font: 11px/1.4 ui-monospace, Consolas, monospace;
        color: #9ff;
        text-shadow: 0 0 3px #000;
        pointer-events: none;
        white-space: pre;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas id="pet"></canvas>
    <img id="overlay" alt="overlay" />
    <div id="hud"></div>
    <!-- Live2D Cubism Core（Live2D 专有软件许可，见 pet://local/license/LICENSE.md） -->
    <script src="pet://local/core/live2dcubismcore.min.js"></script>
    <script src="pet://local/app/pet.js"></script>
  </body>
</html>
